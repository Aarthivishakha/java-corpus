plugins {
    id 'java'
    id 'jacoco'
    id 'checkstyle'
    id 'pmd'
    id 'com.github.spotbugs' version '6.5.11'
}

group = 'com.pramora.testable'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'commons-collections:commons-collections:3.2.1'
    implementation 'org.apache.commons:commons-text:1.9'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.9.10.1'
    implementation 'log4j:log4j:1.2.17'
    implementation 'org.yaml:snakeyaml:1.30'
}

java {
    sourceCompatibility = JavaVersion.VERSION_23
    targetCompatibility = JavaVersion.VERSION_23
}

// See the Kotlin DSL branches: --release pins the API surface, source/target only the
// bytecode level. Both are declared so the build file matches how the family is verified.
tasks.withType(JavaCompile).configureEach {
    options.release.set(23)
}

jacoco {
    toolVersion = '0.8.14'
}

test {
    useJUnit()
    finalizedBy jacocoTestReport
}

checkstyle {
    toolVersion = '14.1.0'
    configFile = file('tools/checkstyle/checkstyle.xml')
}

pmd {
    toolVersion = '7.26.0'
    ruleSetFiles = files('tools/pmd/ruleset.xml')
    ruleSets = []
}

spotbugs {
    toolVersion = '4.10.3'
    excludeFilter = file('tools/spotbugs/exclude.xml')
}

jar {
    manifest {
        attributes 'Main-Class': 'com.pramora.testable.app.Main'
    }
}
